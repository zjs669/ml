# 锁定版本：保证不同机器 pip install 后依赖完全一致。
#
# 用法：
#   pip install -r requirements.lock        # 复现当前验证过的版本
#   pip install -e ".[dev]"                # 开发（跟随 requirements.txt 的 >= 约束）
#
# 为什么不用 uv / pip-tools：本项目依赖只有二十来个、且不涉及复杂的
# 平台相关轮子解析。手工维护这份文件 + CI 跑一次即可，引工具链的
# 学习成本高于收益。升级依赖时改这里，然后本地跑一遍全量测试。
#
# 版本取自 2026-10 本地验证通过的环境（1765 项测试 + ruff 全绿）。

