# 地支「合」类关系：三会、三合、六合
# 规则只声明「哪些关系被触发」，不输出任何吉凶结论（产品文档 §6.2）
version: relations-rules-0.1.0
rules:
  - rule_id: rel.branch.sanhui.yin_mao_chen
    system: sanhui
    kind: triple
    members: [寅, 卯, 辰]
    relation: 三会
    element: 木
    topic: 三会
    priority: 30
    note: 三会方向为寅卯辰会东方木
    source_ref: kb://bazi/relations/sanhui

  - rule_id: rel.branch.sanhui.si_wu_wei
    system: sanhui
    kind: triple
    members: [巳, 午, 未]
