    element: 火
    topic: 三会
    priority: 30
    note: 巳午未会南方火
    source_ref: kb://bazi/relations/sanhui

  - rule_id: rel.branch.sanhui.shen_you_xu
    system: sanhui
    kind: triple
    members: [申, 酉, 戌]
    relation: 三会
    element: 金
    topic: 三会
    priority: 30
    note: 申酉戌会西方金
    source_ref: kb://bazi/relations/sanhui

  - rule_id: rel.branch.sanhui.hai_zi_chou
