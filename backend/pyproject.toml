[project]
name = "xuanshu-backend"
version = "0.1.0"
description = "玄枢国学研习台 - 后端（排盘引擎 + 知识库 + AI 解读）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "PyMySQL>=1.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    # 第三方密钥静态加密（Fernet），见 app/core/secrets.py
    "cryptography>=42.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
    # 农历换算：紫微斗数与六爻时间起卦的运行时依赖，不是测试工具
    "lunar-python>=1.3.10",
    # 图片处理：面相/手相上传要剥 EXIF 并重编码
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

# 规则集刻意保持窄：宁可少查，也不要让人学会忽略 CI 输出。
# 这里的每一条都是「本地全绿、且确实抓到过问题」之后才留下的。
[tool.ruff.lint]
select = [
    "E",    # pycodestyle：缩进、空白
    "F",    # pyflakes：未定义名、重复定义、f-string 占位符
    "B",    # bugbear：可疑写法
]
ignore = [
    "B008",   # FastAPI 的 Depends()/Query() 默认参数是惯用写法
    # B007 会漏看「循环变量在内层语句里被用到」的情况。实测 bazi/engine.py 的
    # `for position, (stem, br) in pillars.items()` 里 position 被用于
    # pillar_facts[position] 与 ten_god 分支，ruff 仍报「未使用」。
    "B007",
    "E501",   # 行宽不在 lint 里重复报错
    # 中文标点（，。「」）在 RUF 系列里算「歧义 Unicode」。这是中文项目，
    # 全角标点是正确写法，不是错误。
    "RUF001",
    "RUF002",
    "RUF003",
    # F401 会自动删掉「只被属性访问」的常量导入。实测 ziwei/constants.py 的
    # CHANG_SHENG_ORDER 只通过 C.CHANG_SHENG_ORDER 访问，ruff 判定为未使用并
    # 删除，直接导致 74 个测试失败。宁可留几个真·无用导入，也不接受这种误删。
    "F401",
]

[tool.ruff.lint.per-file-ignores]
# 测试里用 pytest.raises(Exception) 断言「输入非法」是合理的：具体异常类型属于
# pydantic 内部实现，钉死类型会让升级 pydantic 时测试无谓地红。
"tests/*" = ["B017"]
