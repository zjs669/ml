# 玄枢国学研习台 · 交付用编排
#
# 用法：
#   cd infra
#   cp .env.example .env       # 首次先改口令与密钥
#   docker compose up -d --build
#   浏览器打开 http://localhost:8080
#
# 说明：
#   - 只有 nginx 对外暴露端口，后端与数据库都在内部网络里
#   - 后端容器启动时自动执行 alembic upgrade head，无需手工迁移
#   - 内测环境 LLM_MODE 默认 mock；接真实模型只需改 .env 里的四个 LLM_* 变量

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram_token_size=2
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: 玄枢国学研习台
      API_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}_test?charset=utf8mb4
      LLM_MODE: ${LLM_MODE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS}
      LLM_DAILY_TOTAL_BUDGET: ${LLM_DAILY_TOTAL_BUDGET}
      DAILY_FREE_REPORT_LIMIT: ${DAILY_FREE_REPORT_LIMIT}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"

volumes:
  mysql-data:
