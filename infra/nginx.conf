# Nginx：静态托管前端 SPA + 反代 /api 到后端容器
# 关键点：
#   1. try_files 兜底到 index.html，保证 /charts/12 这类前端路由刷新不 404
#   2. /api 原样透传，不改写路径（后端本身就用 /api/v1 前缀）
#   3. 关闭目录列表，加基础安全响应头

upstream xuanshu_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://xuanshu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://xuanshu_backend/healthz;
        proxy_set_header Host $host;
    }

    # 带内容哈希的产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
